<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ZFY 01 robot hero cover</title>
  <desc id="desc">A cool gray robot portrait with a cream ZFY 01 wordmark and cyan spotlight accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe8e7"/>
      <stop offset="1" stop-color="#b6c5c5"/>
