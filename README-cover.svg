      <stop offset="1" stop-color="#dfe8e7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecf1ef"/>
      <stop offset=".48" stop-color="#7e8f91"/>
      <stop offset="1" stop-color="#24383d"/>
